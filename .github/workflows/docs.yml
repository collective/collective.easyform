# Builds the Sphinx documentation with warnings treated as errors and
# keeps the HTML as a workflow artifact. Not managed by plone/meta.
name: Documentation
permissions: {}

on:
  push:
    paths:
      - "docs/**"
      - "README.rst"
      - ".readthedocs.yaml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "README.rst"
      - ".readthedocs.yaml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

jobs:
  sphinx:
    name: Sphinx build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install Sphinx
        run: pip install -r docs/requirements.txt
      - name: Build the documentation
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
      - uses: actions/upload-artifact@v7
        with:
          name: documentation-html
          path: docs/_build/html
          retention-days: 14
